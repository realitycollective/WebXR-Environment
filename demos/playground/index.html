<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>WebXR Environment - Playground</title>
    <style>
      html, body { margin: 0; height: 100%; overflow: hidden; background: #10141b; }
      #scene-container { width: 100%; height: 100%; }
      #hud {
        position: fixed; left: 16px; bottom: 16px; z-index: 10;
        font: 13px/1.5 system-ui, -apple-system, Segoe UI, sans-serif;
        color: #cfe3f5; background: rgba(10, 16, 26, 0.72);
        border: 1px solid rgba(140, 190, 240, 0.25); border-radius: 10px;
        padding: 12px 14px; max-width: 320px; user-select: none;
      }
      #hud h1 { margin: 0 0 8px; font-size: 13px; letter-spacing: 0.16em; text-transform: uppercase; opacity: 0.7; }
      #hud button {
        margin: 2px 4px 2px 0; padding: 5px 10px; font: inherit; cursor: pointer;
        color: #04121f; background: linear-gradient(180deg, #84e2ff, #34beff);
        border: none; border-radius: 999px;
      }
      #hud .row { margin-top: 8px; }
      #hud label { display: block; margin-top: 6px; opacity: 0.85; }
      #hud input[type="range"] { width: 140px; vertical-align: middle; }
      #state { margin-top: 10px; opacity: 0.6; font-variant-numeric: tabular-nums; }
    </style>
  </head>
  <body>
    <div id="scene-container"></div>
    <div id="hud">
      <h1>Environment playground</h1>
      <div id="presets" class="row"></div>
      <div class="row">
        <button id="passthrough">Toggle passthrough</button>
        <button id="cue">Play cue</button>
      </div>
      <label>Master gain <input id="master" type="range" min="0" max="1" step="0.01" value="1" /></label>
      <label>Ambience bus <input id="ambience" type="range" min="0" max="1" step="0.01" value="0.6" /></label>
      <div id="state"></div>
    </div>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
